name: Artifact

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, ppc64le, riscv64, s390x]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Do not use the cache for tags: release artifacts must not be
      # built from a (potentially poisoned) cache. zizmor does not take
      # the step's "if:" into account, hence the ignore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        if: github.ref_type != 'tag'
        with:
          path: .cache
          key: nix-v3-${{ matrix.arch }}-${{ hashFiles('flake.lock') }}

      - run: |
          set -ex
          sudo mkdir -p .cache
          sudo mv .cache /nix
          sudo RUNTIME=docker SKIP_CHECKS=1 SKIP_GPG=1 SKIP_DIST=1 ARCHES="$ARCH" OUTDIR=out build-aux/release.sh
          sudo mv /nix .cache
          sudo chown -Rf "$(whoami)" .cache

      - run: |
          mkdir /tmp/artifact
          sudo mv out/crun-*-linux-"$ARCH" /tmp/artifact/crun-linux-"$ARCH"
          sudo mv out/crun-*-linux-"$ARCH"-disable-systemd /tmp/artifact/crun-linux-"$ARCH"-disable-systemd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crun-linux-${{ matrix.arch }}
          path: /tmp/artifact/crun-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crun-linux-${{ matrix.arch }}-disable-systemd
          path: /tmp/artifact/crun-linux-${{ matrix.arch }}-disable-systemd

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: sudo apt-get update

      - run: sudo apt-get install -y make git gcc build-essential pkgconf libtool libsystemd-dev libcap-dev libseccomp-dev go-md2man libtool autoconf python3 automake libprotobuf-c-dev libjson-c-dev

      - run: RUNTIME=docker SKIP_CHECKS=1 SKIP_GPG=1 ARCHES='' OUTDIR=out build-aux/release.sh

      - run: |
          mkdir /tmp/artifact
          mv out/*.tar.gz /tmp/artifact/crun.tar.gz
          mv out/*.tar.zst /tmp/artifact/crun.tar.zst

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crun.tar.gz
          path: /tmp/artifact/crun.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crun.tar.zst
          path: /tmp/artifact/crun.tar.zst

  # Keep the "artifact" name: it is a required status check.
  artifact:
    needs: [build, dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/artifact
          merge-multiple: true

      - run: |
          cd /tmp/artifact
          ls -l
          sha256sum -- * | tee CHECKSUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CHECKSUMS
          path: /tmp/artifact/CHECKSUMS

  release:
    needs: artifact
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -ex
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          for ARCH in amd64 arm64 ppc64le riscv64 s390x; do
            mv "artifacts/crun-linux-${ARCH}" "release/crun-${VERSION}-linux-${ARCH}"
            mv "artifacts/crun-linux-${ARCH}-disable-systemd" "release/crun-${VERSION}-linux-${ARCH}-disable-systemd"
          done
          mv artifacts/crun.tar.gz "release/crun-${VERSION}.tar.gz"
          mv artifacts/crun.tar.zst "release/crun-${VERSION}.tar.zst"
          (cd release && sha256sum -- * > CHECKSUMS)

      - name: Extract release notes from NEWS
        run: |
          awk -v hdr="* crun-${GITHUB_REF_NAME}" '
            $0 == hdr { capture = 1; next }
            capture && /^\* crun-/ { exit }
            capture { print }
          ' NEWS > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "no '* crun-${GITHUB_REF_NAME}' section found in NEWS" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            release/*
