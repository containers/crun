name: Test

on: [push, pull_request]

jobs:
  build_job:
    runs-on: ubuntu-latest
    name: Build on ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: armv7
            distro: ubuntu_latest
#          - arch: aarch64
#            distro: ubuntu_latest
#          - arch: s390x
#            distro: ubuntu_latest
#          - arch: ppc64le
#            distro: ubuntu_latest
          - arch: riscv64
            distro: ubuntu_latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          set-safe-directory: true

      - uses: uraimo/run-on-arch-action@v3.2.0
        name: Build
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}

          githubToken: ${{ github.token }}

          install: |
            apt-get update -y
            apt-get install -y automake libtool autotools-dev libseccomp-dev git make libcap-dev cmake pkg-config gcc wget go-md2man libsystemd-dev gperf clang-format libjson-c-dev libprotobuf-c-dev clang mawk

          run: |
            find $(pwd) -name '.git' -exec bash -c 'git config --global --add safe.directory ${0%/.git}' {} \;
            ./autogen.sh
            ./configure --enable-embedded-blake3 --enable-werror || { cat config.log; exit 1; }
            make -j $(nproc) -C libocispec libocispec.la
            make git-version.h
            make -j $(nproc) libcrun.la
            make -j $(nproc) crun

            make -j $(nproc) clean

            if ./configure --enable-embedded-blake3 --enable-shared --enable-werror; then
                        make -j $(nproc) -C libocispec libocispec.la
                        make git-version.h
                        make -j $(nproc) libcrun.la
                        make -j $(nproc) crun
            fi

  Test:
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: disable-systemd
          - test: check
          - test: check-no-openat2
          - test: enable-shared
          - test: embedded-blake3
          - test: system-blake3
          - test: podman
          #- test: cri-o
          - test: containerd
          - test: oci-validation
          - test: alpine-build
          - test: centos9-build
          #- test: centos10-build
          - test: clang-format
          - test: clang-check
          - test: bindings
          - test: checkpoint-restore
          - test: fuzzing
          - test: codespell
          - test: wasmedge-build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install dependencies
        run: |
          # If Dockerfile is present in test directory, the test is run
          # inside container, so these dependencies won't be needed.
          test -f "tests/${{ matrix.test }}/Dockerfile" && exit 0

          sudo add-apt-repository -y ppa:criu/ppa
          # add-apt-repository runs apt-get update so we don't have to.
          sudo apt-get install -q -y criu automake libtool autotools-dev libseccomp-dev git make libcap-dev cmake pkg-config gcc wget libsystemd-dev gperf clang-format libjson-c-dev containerd runc libasan6 libprotobuf-c-dev mawk python3-dev lua5.4 liblua5.4-dev
          # Fedora (used by maintainers as well as for packaging) has newer
          # md2man than in Ubuntu, so we have to install it from source.
          GOBIN=~/.local/bin go install github.com/cpuguy83/go-md2man/v2@latest

      - name: run autogen.sh
        run: |
          git clean -fdx .
          find $(pwd) -name '.git' -exec bash -c 'git config --global --add safe.directory ${0%/.git}' {} \;
          ./autogen.sh

      - name: run test
        run: |
          case "${{ matrix.test }}" in
              disable-systemd)
                  ./configure --enable-embedded-blake3 --disable-systemd
                  make -j $(nproc)
              ;;
              check)
                  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  ./configure --enable-embedded-blake3 --disable-dl
                  make
                  # Check that autogenerated files that are in git has not changed.
                  git diff --exit-code

                  make syntax-check
                  echo run tests as root
                  sudo make check ASAN_OPTIONS=detect_leaks=false || (cat test-suite.log; exit 1)
                  echo run tests as rootless
                  make check ASAN_OPTIONS=detect_leaks=false || (cat test-suite.log; exit 1)
                  echo run tests as rootless in a user namespace
                  unshare -r make check ASAN_OPTIONS=detect_leaks=false || (cat test-suite.log; exit 1)
              ;;
              check-no-openat2)
                  # Run the test suite with openat2(2) forced to fail with
                  # ENOSYS, so that the safe_openat() fallback used on kernels
                  # older than 5.6 is exercised.  GitHub runners always have a
                  # much newer kernel, so this path is otherwise never tested.
                  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  ./configure --enable-embedded-blake3 --disable-dl
                  make
                  # Only the root run: without CAP_SYS_ADMIN the helper has to
                  # set NO_NEW_PRIVS to install its seccomp filter, and that is
                  # inherited by the test containers.
                  echo run tests as root, openat2 blocked
                  sudo make check-no-openat2 ASAN_OPTIONS=detect_leaks=false || (cat test-suite.log; exit 1)
              ;;
              podman)
                  sudo mkdir -p /var/lib/containers /var/tmp
                  sudo docker build -t crun-podman tests/podman
                  sudo docker run --cgroupns=host --privileged --rm -v /var/tmp:/var/tmp:rw -v /var/lib/containers:/var/lib/containers:rw -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-podman
                  ;;
              #cri-o)
              #    sudo mkdir -p /var/lib/var-crio/tmp /var/lib/tmp-crio /var/lib/var-tmp-crio
              #    sudo docker build -t crun-cri-o tests/cri-o
              #    sudo docker run --cgroupns=host  --net host --privileged --rm -v /dev/zero:/sys/module/apparmor/parameters/enabled -v /var/lib/tmp-crio:/tmp:rw -v /var/lib/var-tmp-crio:/var/tmp -v /var/lib/var-crio:/var/lib/containers:rw -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-cri-o
              #    ;;
              containerd)
                  sudo mkdir -p /var/lib/var-containerd
                  sudo docker build -t crun-containerd tests/containerd
                  sudo docker run --cgroupns=host --privileged --net host --rm -v /tmp:/tmp:rw -v /var/lib/var-containerd:/var/lib:rw -v /sys:/sys:rw,rslave -v ${PWD}:/crun crun-containerd
                  ;;
              oci-validation)
                  sudo docker build -t crun-oci-validation tests/oci-validation
                  sudo docker run --cgroupns=host --privileged --rm -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-oci-validation
              ;;
              alpine-build)
                  sudo docker build -t crun-alpine-build tests/alpine-build
                  sudo docker run --cgroupns=host --privileged --rm -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-alpine-build
              ;;
              centos9-build)
                  sudo docker build -t crun-centos9-build tests/centos9-build
                  sudo docker run --cgroupns=host --privileged --rm -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-centos9-build
              ;;
              centos10-build)
                  sudo docker build -t crun-centos10-build tests/centos10-build
                  sudo docker run --cgroupns=host --privileged --rm -v /var/tmp:/var/tmp:rw -v /var/lib/containers:/var/lib/containers:rw -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-centos10-build
              ;;
              clang-format)
                  sudo docker build -t crun-clang-format tests/clang-format
                  sudo docker run --rm -w /crun -v ${PWD}:/crun crun-clang-format
              ;;
              clang-check)
                  sudo docker build -t crun-clang-check tests/clang-check
                  sudo docker run --privileged --rm -w /crun -v ${PWD}:/crun crun-clang-check
              ;;
              enable-shared)
                  ./configure --enable-embedded-blake3 --enable-shared
                  make -j $(nproc)
              ;;
              bindings)
                  # Build the Python and Lua bindings and load each freshly
                  # built module.  The bindings link against internal libcrun
                  # symbols, so a build here catches API drift and missing
                  # exports (e.g. libcrun_container_spec, parse_json_file)
                  # before it reaches a release.
                  ./configure --enable-embedded-blake3 --enable-shared --with-python-bindings --with-lua-bindings --enable-werror
                  make -j $(nproc)
                  export LD_LIBRARY_PATH="$PWD/.libs:$LD_LIBRARY_PATH"
                  PYTHONPATH="$PWD/.libs" python3 python/test_python_bindings.py
                  LUA_CPATH="$PWD/.libs/?.so;;" lua5.4 lua/test_lua_bindings.lua
              ;;
              embedded-blake3)
                  ./configure --enable-embedded-blake3
                  make -j $(nproc)
              ;;
              system-blake3)
                  sudo docker build -t crun-system-blake3 tests/system-blake3
                  sudo docker run --rm -v ${PWD}:/crun crun-system-blake3
              ;;
              checkpoint-restore)
                  ./configure --enable-embedded-blake3
                  make -j $(nproc)
                  sudo python3 tests/test_checkpoint_restore.py
              ;;
              fuzzing)
                  sudo docker build -t crun-fuzzing tests/fuzzing
                  sudo docker run --cgroupns=host -e RUN_TIME=300 --privileged --rm -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave -v ${PWD}:/crun crun-fuzzing
              ;;
              codespell)
                  pip install --break-system-packages codespell==v2.4.1 # Use known version
                  codespell
              ;;
              wasmedge-build)
                  sudo docker build -t wasmedge tests/wasmedge-build
                  sudo docker run --privileged --cgroupns=host --rm -v containers:/var/lib/containers:rw -v /sys/fs/cgroup:/sys/fs/cgroup:rw,rslave  -w /crun -v ${PWD}:/crun wasmedge
              ;;
          esac

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install shfmt
        env:
          VERSION: v3.14.0
          BASEURL: https://github.com/mvdan/sh/releases/download
          SHA256: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL --retry 5 -o ~/.local/bin/shfmt \
            $BASEURL/$VERSION/shfmt_${VERSION}_linux_amd64
          sha256sum --strict --check - <<<"$SHA256 *$HOME/.local/bin/shfmt"
          chmod +x ~/.local/bin/shfmt
      - name: install shellcheck
        env:
          VERSION: v0.11.0
          BASEURL: https://github.com/koalaman/shellcheck/releases/download
          SHA256: 4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL --retry 5 $BASEURL/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz |
            tar xfJ - -C ~/.local/bin --strip 1 shellcheck-$VERSION/shellcheck
          sha256sum --strict --check - <<<"$SHA256 *$HOME/.local/bin/shellcheck"
          # make sure to remove the old version
          sudo rm -f /usr/bin/shellcheck
      - name: install dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y automake libtool autotools-dev libseccomp-dev git make libcap-dev cmake pkg-config gcc wget go-md2man libsystemd-dev gperf clang-format libjson-c-dev libprotobuf-c-dev mawk
      - uses: lumaxis/shellcheck-problem-matchers@v2
      - name: shellcheck
        run: |
          find $(pwd) -name '.git' -exec bash -c 'git config --global --add safe.directory ${0%/.git}' {} \;
          ./autogen.sh
          ./configure --enable-embedded-blake3
          make shellcheck
      - name: shfmt
        run: |
          make shfmt
          git diff --ignore-submodules --exit-code
